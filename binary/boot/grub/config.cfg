set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gopmenuentry "CUST-LIVE-DEB (amd64)" --hotkey=c {
	linux	/live/vmlinuz boot=live toram persistence
	initrd	/live/initrd
}

menuentry "Cust-Live-Deb (amd64 failsafe)" --hotkey=f{
    linux   /live/vmlinuz boot=live persistence config memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
    initrd  /live/initrd
}
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
